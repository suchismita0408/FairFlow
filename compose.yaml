name: fairflow-platform
services:
  db:
    image: postgres:17
    restart: unless-stopped
    env_file: .env.database
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - fairflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fairflow -d fairflow"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  fairflow_pgdata:
